<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLASH ROLEPLAY</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="locked">

    <div id="enter-screen" role="button" tabindex="0" aria-label="Clique para entrar">
        <span>[ CLIQUE PARA ENTRAR ]</span>
    </div>

    <div id="particles"></div>
    <div class="background"></div>
    <div class="overlay"></div>

    <main class="container">
        <img src="assets/logo2.png" class="logo" alt="Logo Flash Roleplay">

        <h1>FLASH ROLEPLAY</h1>

        <p>
            Entre para a comunidade Flash Roleplay. Acompanhe as novidades,
            participe do Discord e confira nossos conteúdos.
        </p>

        <div class="buttons">
            <a href="https://discord.gg/sYxUsNg4M9" target="_blank" rel="noopener noreferrer" class="btn discord">
                <i class="fab fa-discord"></i> Discord
            </a>

            <a href="https://www.youtube.com/@flashrp01" target="_blank" rel="noopener noreferrer" class="btn youtube">
                <i class="fab fa-youtube"></i> YouTube
            </a>

            <a href="https://www.tiktok.com/@flashrp01?lang=pt-BR" target="_blank" rel="noopener noreferrer" class="btn tiktok">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
        </div>

        <div class="spotify-player">
            <iframe
                src="https://open.spotify.com/embed/track/6x1FttETfbRLerumlTn0ZH?utm_source=generator&theme=0"
                title="Spotify Player"
                width="100%"
                height="100"
                frameborder="0"
                allowfullscreen
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>

        <footer>@flashrp01</footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
